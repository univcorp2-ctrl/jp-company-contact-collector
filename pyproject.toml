[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-company-contact-collector"
version = "0.2.0"
description = "Collect public role-based corporate contacts from official company websites"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "beautifulsoup4==4.12.3",
  "httpx==0.27.2",
  "tldextract==5.1.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "ruff==0.6.8",
  "mypy==1.11.2",
]

[project.scripts]
company-contact-collector = "company_contact_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q --cov=company_contact_collector --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
