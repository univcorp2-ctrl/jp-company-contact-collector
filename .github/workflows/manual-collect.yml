name: Manual public contact collection
on:
  workflow_dispatch:
    inputs:
      min_revenue_yen:
        description: Minimum annual revenue in yen
        required: true
        default: '1000000000000'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Collect public contacts
        run: company-contact-collector collect --input sample/companies.csv --output outputs/contacts.csv --min-revenue-yen '${{ inputs.min_revenue_yen }}' --delay-seconds 2 --page-limit 10
      - uses: actions/upload-artifact@v4
        with:
          name: public-contact-results
          path: outputs/contacts.csv
          retention-days: 3
